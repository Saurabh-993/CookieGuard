# =============================================================================
# CookieGuard — production stack (Phase 7)
# =============================================================================
#
# HOW THIS DIFFERS FROM THE ROOT docker-compose.yml, AND WHY
# -----------------------------------------------------------
#   root file (development)          this file (production)
#   ------------------------         --------------------------------------
#   build: .                         image: ghcr.io/...  — PULLS, never builds
#   ports 127.0.0.1:8000             NO published port on the app at all
#   one service                      two: the app + Caddy in front of it
#   CORS = localhost                 CORS = your real HTTPS origin
#
# **The server never builds the image.** It pulls the exact artifact that CI
# already built and smoke-tested. That's the point of the registry:
#
#   · a t3.micro would take ~20 minutes to build it, and might run out of RAM
#   · no source code, compilers or build tools on the internet-facing box
#   · the thing running in production is BIT-IDENTICAL to the thing CI tested,
#     rather than "the same source, built again, hopefully the same way"
#
# Deploy is therefore `docker compose pull && docker compose up -d`.
#
# RUN IT FROM THE deploy/ DIRECTORY:
#     docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:

  # ===========================================================================
  # The application
  # ===========================================================================
  cookieguard:
    # ⚠ No `build:` key. Set GHCR_IMAGE in deploy/.env, e.g.
    #     GHCR_IMAGE=ghcr.io/saurabh-993/cookieguard:latest
    #
    # In real operation, prefer a SHA tag over :latest —
    #     ghcr.io/saurabh-993/cookieguard:9f2c1a...
    # `:latest` tells you nothing about what is actually running, and makes
    # rollback guesswork. With a SHA, rollback is editing one line.
    image: ${GHCR_IMAGE:-ghcr.io/saurabh-993/cookieguard:latest}
    container_name: cookieguard

    # ---- ⚠ NO `ports:` — AND THAT IS THE SECURITY DESIGN --------------------
    # This container is reachable ONLY from the private compose network, which
    # means only from Caddy. Publishing 8000 here would expose the app directly
    # on the instance's public IP, bypassing TLS and every security header —
    # and people would find it. Automated scanners sweep every public IPv4
    # address on common ports continuously; "nobody knows the port" is not a
    # defence, it's a delay of about twenty minutes.

    volumes:
      - cookieguard-data:/data

    env_file:
      - path: .env
        required: false

    environment:
      ENVIRONMENT: production
      COOKIEGUARD_HOST: 0.0.0.0
      COOKIEGUARD_PORT: "8000"
      COOKIEGUARD_DB: /data/cookieguard.db

      # ---- THE PAYOFF FROM PHASE 6 --------------------------------------
      # Going live is one environment variable. No code change, no rebuild,
      # no redeploy of anything but this file. That is exactly what "config
      # in the environment" buys you, and it's worth noticing that the work
      # was done a phase early.
      #
      # ⚠ Must be https:// and must NOT have a trailing slash. An origin is
      # compared as an exact string — `https://x.duckdns.org/` never matches
      # anything, and the browser's only feedback is "request blocked".
      CORS_ORIGINS: ${SITE_URL:-https://cookieguard.duckdns.org}

    # ---- Running behind a proxy ----------------------------------------
    # `--proxy-headers` tells uvicorn to trust X-Forwarded-Proto and
    # X-Forwarded-For. Without it every request looks like plain HTTP from
    # Caddy's container IP, so redirects come out as http:// and any future
    # rate-limiting would see one client instead of many.
    #
    # `--forwarded-allow-ips="*"` is safe HERE and would be dangerous on a
    # public port: it means "trust those headers from anyone". Since nothing
    # but Caddy can reach this container, "anyone" is Caddy. On a published
    # port a client could forge X-Forwarded-For and spoof its own address.
    command: >
      uvicorn api.main:app
      --host 0.0.0.0 --port 8000 --workers 1
      --proxy-headers --forwarded-allow-ips=*

    cap_add:
      - SYS_ADMIN          # keeps Chromium's sandbox — see the root compose file
    shm_size: 1gb

    deploy:
      resources:
        limits:
          # ⚠ t3.micro has 1 GB of RAM TOTAL. Chromium needs 400-700 MB during
          # a scan. This limit plus the 2 GB swap file created by
          # setup-server.sh is what stops a scan taking the whole box down.
          #
          # Without the limit, the Linux OOM killer picks a victim when memory
          # runs out — and it often picks Caddy or sshd rather than the process
          # that caused the problem. You then can't even log in to investigate.
          memory: 800m

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Caddy — TLS termination and reverse proxy
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    depends_on:
      - cookieguard

    # The ONLY container with published ports. This is the entire public
    # surface of the server.
    ports:
      - "80:80"      # required: Let's Encrypt's HTTP challenge, and the
                     # redirect to HTTPS. Closing 80 breaks certificate renewal.
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC), which runs over UDP. Optional but free.

    volumes:
      # `:ro` — read-only. Caddy never needs to modify its own config, and a
      # compromised proxy that cannot rewrite its routing rules is meaningfully
      # less useful to an attacker.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # ⚠ THESE TWO VOLUMES ARE NOT OPTIONAL.
      # /data holds the TLS certificates and the ACME account key. Lose it and
      # every restart requests fresh certificates — and Let's Encrypt enforces
      # a limit of 5 duplicate certificates per week. Blow through that while
      # debugging and you are locked out of HTTPS until the window resets.
      # There is a staging endpoint for exactly this; see deploy/README.md.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

    environment:
      # Read by the Caddyfile. Set in deploy/.env.
      SITE_ADDRESS: ${SITE_ADDRESS:-cookieguard.duckdns.org}

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cookieguard-data:
  caddy-data:
  caddy-config:
  caddy-logs:

# Both services join the default network compose creates, which is why
# `reverse_proxy cookieguard:8000` in the Caddyfile resolves. Docker runs a DNS
# server on that network that maps service names to container IPs — no IP
# addresses to hardcode, and it still works after a container is recreated with
# a different address.
