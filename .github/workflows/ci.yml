# =============================================================================
# CookieGuard — Continuous Integration (Phase 6)
# =============================================================================
#
# WHAT CI IS, AND WHAT IT IS ACTUALLY FOR
# ---------------------------------------
# Continuous Integration means: every push runs the checks automatically, on a
# clean machine that nobody has configured by hand.
#
# The obvious benefit is "it catches broken tests". The real benefit is the
# CLEAN MACHINE. Your laptop has packages you installed months ago and forgot,
# a browser Playwright downloaded once, environment variables set in a shell
# you never closed. CI has none of that. So CI does not just check that the
# code works — it checks that the code works FOR SOMEONE WHO IS NOT YOU.
#
# That is the same guarantee the Dockerfile provides, arrived at from the other
# direction, and it's the honest answer to "why do I need CI, I run the tests".
#
# THE VOCABULARY (worth being precise about in an interview)
# ----------------------------------------------------------
#   Workflow  this file. Triggered by an event.
#   Job       a set of steps on one fresh virtual machine. Jobs run in
#             PARALLEL by default, and share nothing — no files, no memory.
#   Step      one command or one reusable Action.
#   Runner    the machine. `ubuntu-latest` is a clean VM, destroyed after.
#
# "Jobs share nothing" is the detail people get wrong. If job B needs something
# job A produced, you either upload an artifact or rebuild it. There is no
# shared disk.
#
# CI vs CD:
#   Continuous Integration  — verify every change             (this file)
#   Continuous Delivery     — produce a deployable artifact   (the docker job)
#   Continuous Deployment   — push it to production automatically  (Phase 7)
# =============================================================================

name: CI

# ---- WHEN DOES THIS RUN? ----------------------------------------------------
# Both triggers matter, for different reasons:
#
#   push          — the branch itself is verified, so `main` is always known-good
#   pull_request  — the MERGE RESULT is verified before it lands
#
# The second is not redundant. A PR can pass on its own branch and still break
# main, because main moved underneath it. GitHub tests the merge commit, which
# is the thing that will actually exist afterwards.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you re-run this from the Actions tab without an empty commit — useful
  # when a failure was a flaky network rather than the code.
  workflow_dispatch:

# ---- CONCURRENCY ------------------------------------------------------------
# Push three commits quickly and you get three parallel runs, two of which are
# already obsolete. This cancels superseded runs for the same branch: faster
# feedback, fewer wasted minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---- PERMISSIONS ------------------------------------------------------------
# Least privilege, set at the top so every job starts with almost nothing and
# has to ask. `contents: read` is enough to clone. The docker job adds
# `packages: write` for itself only.
permissions:
  contents: read

jobs:

  # ===========================================================================
  # JOB 1 — Lint
  # ===========================================================================
  # Separate from the tests on purpose. Lint finishes in ~15 seconds, tests
  # take minutes; a syntax error should tell you in fifteen seconds. Because
  # jobs run in parallel, this costs no wall-clock time at all.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ruff is a linter written in Rust: it does the job of flake8 plus a
      # dozen plugins, and finishes this repository in well under a second.
      - name: Install ruff
        run: pip install ruff==0.14.2

      # `--output-format=github` makes failures appear as annotations on the
      # exact line in the PR diff, instead of as text buried in a log nobody
      # opens. Small flag, large difference in whether lint gets fixed.
      - name: Lint
        run: ruff check . --output-format=github

  # ===========================================================================
  # JOB 2 — Tests
  # ===========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # A MATRIX runs this job once per value, in parallel. Two versions because:
    #   3.11 — what many Linux distributions still ship
    #   3.12 — what the Docker image and .venv use
    # This is how the Phase 1 dependency problem gets caught by a machine
    # instead of by Saurabh: a package with no wheel for one interpreter fails
    # here, in a job named after the version, rather than on someone's laptop.
    strategy:
      # Without this, the FIRST failure cancels the other versions — so you fix
      # 3.11, push, and only then discover 3.12 was broken too. Two round trips
      # for information you could have had at once.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # uv, same as locally and in the container. `enable-cache` stores uv's
      # package cache between runs — installs drop from ~40s to ~5s.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      # Node is needed by two test files that run JavaScript from frontend/
      # under Node (the globe quaternion maths and chartFrame). ubuntu-latest
      # already ships Node, so this pins it rather than installing it — the
      # tests skip cleanly if it is missing, but we would rather they RUN.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---- The environment the tests run in --------------------------------
      # COOKIEGUARD_DB points at a throwaway path so a test can never touch a
      # real database. That is belt-and-braces: db.py already resolves its path
      # lazily per call (the late-binding fix from Phase 2b) and the tests use
      # temporary files. Two independent guards, because "the tests deleted the
      # data" is not a recoverable mistake.
      - name: Run tests
        env:
          COOKIEGUARD_DB: /tmp/cookieguard-ci.db
          ENVIRONMENT: ci
        # -q quiet, --tb=short readable tracebacks, --strict-markers turns a
        # typo'd @pytest.mark into an error rather than a silently ignored
        # decorator (a genuinely nasty way to lose test coverage).
        run: python -m pytest -q --tb=short --strict-markers

  # ===========================================================================
  # JOB 3 — Build the container and prove it starts
  # ===========================================================================
  # `needs:` makes this wait for lint and tests. Building a 2GB image for code
  # that fails lint wastes several minutes of runner time for no information.
  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      # Buildx is Docker's modern builder. We want it specifically for
      # GitHub Actions cache support, below.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Build ------------------------------------------------------------
      # cache-from/to type=gha reuses layers from previous runs, stored in
      # GitHub's own cache. Without it every run re-downloads the ~1.5GB
      # Playwright base image and reinstalls everything: roughly 6 minutes
      # becomes roughly 1.
      #
      # `load: true` puts the built image into the runner's local Docker so the
      # next step can actually run it. Without it the image exists only inside
      # the builder's cache and `docker run` reports "image not found" — a
      # confusing failure that catches people the first time.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cookieguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- THE SMOKE TEST ---------------------------------------------------
      # A build that succeeds proves the image was ASSEMBLED. It proves nothing
      # about whether the application starts. Every genuinely container-shaped
      # bug lives in that gap:
      #
      #     · bound to 127.0.0.1, so nothing outside can reach it
      #     · /data not writable by the non-root user
      #     · a module that imports fine locally and not in the image
      #     · Chromium missing a library
      #
      # None of those are visible to `docker build`. So we start it and ask.
      - name: Start the container
        run: |
          docker run -d --name cookieguard-ci \
            -p 8000:8000 \
            --cap-add=SYS_ADMIN \
            --shm-size=1g \
            -e ENVIRONMENT=ci \
            cookieguard:ci

      # POLL, don't sleep. `sleep 30` is both too long when the app is ready in
      # 3 seconds and too short on a slow runner — it makes the pipeline slower
      # AND flakier at the same time. Polling with a deadline is strictly better
      # on both counts.
      - name: Wait for /health
        run: |
          echo "Polling http://127.0.0.1:8000/health ..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json 2>/dev/null; then
              echo "Healthy after ${i}s:"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done

          # ---- Fail LOUDLY and usefully -------------------------------------
          # A red X saying "step failed" makes you rebuild locally to find out
          # why. Dumping the container's logs and state means the answer is
          # already on screen. Making failures self-diagnosing is worth the
          # five extra lines every single time.
          echo "::error::Container never became healthy"
          echo "--- docker ps -a ---"
          docker ps -a
          echo "--- container logs ---"
          docker logs cookieguard-ci
          exit 1

      # Check the API is actually serving real content, not just answering.
      # A health endpoint can be fine while routing is broken.
      - name: Verify the dashboard is served
        run: |
          curl -fsS http://127.0.0.1:8000/dashboard/ | grep -q "CookieGuard" \
            && echo "Dashboard OK"

      # ---- ⚠ THE STEP THIS JOB WAS MISSING ---------------------------------
      # The first image built by this workflow started cleanly, reported
      # healthy, and served the dashboard — and every scan failed, because the
      # Playwright PACKAGE had resolved to a newer version than the browsers
      # baked into the base image.
      #
      # None of the checks above could see it. They exercise the web layer;
      # the browser only starts when someone clicks Scan. So the smoke test
      # was verifying the easy half.
      #
      # The lesson generalises past this bug:
      #
      #   A smoke test must exercise the thing MOST LIKELY TO BREAK, not the
      #   thing easiest to check. For us that is the headless browser — the
      #   heaviest dependency, the one coupled to the base image, and the one
      #   with the most moving parts.
      #
      # example.com is deliberate: tiny, stable, no consent banner, no
      # geo-gating, and it will not rate-limit a CI runner.
      - name: Verify Chromium actually runs a scan
        run: |
          curl -fsS --max-time 90 -X POST http://127.0.0.1:8000/api/scan \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com","wait_seconds":3,"save":false}' \
            -o /tmp/scan.json

          cat /tmp/scan.json

          # `error` must be null. A scan that fails to launch the browser
          # still returns HTTP 200 with the failure recorded in the body —
          # which is correct API design, and means `curl -f` alone would pass.
          python3 -c "
          import json, sys
          r = json.load(open('/tmp/scan.json'))
          if r.get('error'):
              print('::error::Scan reported an error:', r['error'])
              sys.exit(1)
          print('Scan OK —', r['cookie_count'], 'cookies from', r['domain'])
          "

      # `if: always()` runs this even when an earlier step failed. Without it a
      # failure leaves the container running and the log is never collected —
      # exactly when you most want it.
      - name: Tear down
        if: always()
        run: docker rm -f cookieguard-ci || true

  # ===========================================================================
  # JOB 4 — Publish the image (main branch only)
  # ===========================================================================
  # This is the Delivery in "CI/CD": every commit to main produces a pulled-and-
  # runnable artifact. Phase 7's EC2 host then only has to `docker pull`, with
  # no build tools and no source code on the server.
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [docker]
    # Only on main, and never from a fork's pull request — a fork PR must not
    # be able to publish an image under your name. `github.event_name` is the
    # check that enforces it.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write        # required to push to GitHub Container Registry

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is minted per run by GitHub and expires when the run ends.
      # No secret to create, rotate, or leak — which is why this is preferred
      # over a personal access token whenever it's possible.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠ LOWERCASE THE IMAGE NAME.
      # `github.repository` is "Saurabh-993/CookieGuard" — with capitals,
      # because that's how the repo is named. Container registries require
      # lowercase image paths and reject anything else with:
      #     invalid reference format: repository name must be lowercase
      #
      # This would have failed on the first push to main, at the very last
      # step, after everything else went green. GitHub's expression language
      # has no lower() function, so it's done here in shell and passed on via
      # $GITHUB_OUTPUT — the standard way one step hands a value to the next.
      - name: Lowercase the image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        # ${VAR,,} is bash parameter expansion for "lowercase everything".

      # TAGGING STRATEGY — two tags, for two different needs:
      #   :latest         convenient, but ambiguous. "latest" tells you nothing
      #                   about WHAT is running.
      #   :<git-sha>      immutable and traceable. When production misbehaves,
      #                   this tag identifies the exact commit that built it,
      #                   and rolling back is `docker run` with an old sha.
      # Deploy by sha; keep :latest for convenience.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:latest
            ghcr.io/${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
